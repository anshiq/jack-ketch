name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Version gate: heavy jobs only run for PRs or pushes that assign a
  # version (any version-file change). Plain master pushes get their patch
  # bump from auto-bump.yml and skip everything else.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.g.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" "${{ github.sha }}" -- internal/mcp/server.go cmd/jackketchd/main.go Makefile packaging/nix/flake.nix ui/package.json ui/package-lock.json ui/vite.config.ts; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: [gate]
    if: needs.gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./internal/store/... ./internal/session/... ./internal/config/... ./internal/core/... ./internal/server/... ./internal/mcp/... ./internal/integrate/... ./internal/daemon/... ./pkg/...
      - name: Tests
        run: go test ./...
  proto:
    needs: [gate]
    if: needs.gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.50.0
      - name: Install plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.18.1
          npm --prefix ui install --no-audit --no-fund
      - name: Proto clean
        run: |
          make proto
          git diff --exit-code -- gen/ ui/src/gen/ || (echo "gen/ is stale: run make proto" && exit 1)
      - name: Breaking
        run: make proto
  cross-compile:
    # §10: Linux is implemented now; darwin/windows stay compiling.
    needs: [gate]
    if: needs.gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
  ui:
    needs: [gate]
    if: needs.gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm --prefix ui install --no-audit --no-fund
      - name: Check
        run: npm --prefix ui run check
      - name: Unit
        run: npm --prefix ui test
      - name: Build
        run: npm --prefix ui run build
      - name: Embed
        run: make ui-web-embed
      - name: Dist freshness
        run: |
          git add -A -- internal/webui/dist
          if ! git diff --cached --quiet -- internal/webui/dist; then
            echo "internal/webui/dist is stale: run 'make ui-web' and commit the result"
            git diff --cached --stat -- internal/webui/dist
            exit 1
          fi
