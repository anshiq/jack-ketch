// LogService provides log access, search, and tailing.
syntax = "proto3";

package jackketch.v1;
option go_package = "jack-ketch/gen/jackketch/v1;jackketchv1";

import "jackketch/v1/common.proto";

service LogService {
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
  rpc SearchLogs(SearchLogsRequest) returns (SearchLogsResponse);
  rpc TailLogs(TailLogsRequest) returns (stream LogEntry);
  rpc WaitForLog(WaitForLogRequest) returns (WaitForLogResponse);
  rpc ClearLogs(ClearLogsRequest) returns (ClearLogsResponse);
  rpc ExportLogs(ExportLogsRequest) returns (stream LogChunk);
  rpc GetLogStats(GetLogStatsRequest) returns (GetLogStatsResponse);
}

message GetLogsRequest {
  string process_id = 1;
  string stream = 2; // stdout | stderr | all
  int32 lines = 3;
  string contains = 4;
  string level = 5;
}
message GetLogsResponse {
  repeated LogEntry entries = 1;
  bool truncated = 2;
  int32 returned_lines = 3;
  int32 available_lines = 4;
  string source = 5;
}

message SearchLogsRequest {
  string query = 1;
  string regex = 2;
  string time_from = 3;
  string time_to = 4;
  string stream = 5;
  int32 max_rows = 6;
}
message SearchLogsResponse {
  repeated LogEntry entries = 1;
  bool truncated_scan = 2;
  int32 total_matches = 3;
}

message TailLogsRequest {
  string process_id = 1;
  int32 backlog_lines = 2;
  string stream = 3;
  Cursor cursor = 4;
}
message LogEntry {
  int64 seq = 1;
  int64 ts = 2;
  string stream = 3;
  string line = 4;
  string level = 5;
  Cursor cursor = 6;
  bool snapshot = 7;
  bool heartbeat = 8;
}

message WaitForLogRequest {
  string process_id = 1;
  string contains = 2;
  string pattern = 3;
  bool ready = 4;
  int32 timeout_ms = 5;
}
message WaitForLogResponse {
  bool matched = 1;
  bool exited = 2;
  bool timeout = 3;
  LogEntry entry = 4;
}

message ClearLogsRequest {
  string process_id = 1;
  string stream = 2;
}
message ClearLogsResponse {
  string process_id = 1;
  int64 removed = 2;
}

message ExportLogsRequest {
  string process_id = 1;
  string format = 2; // ndjson | txt
}
message LogChunk {
  bytes data = 1;
  bool done = 2;
}

message GetLogStatsRequest { string process_id = 1; }
message GetLogStatsResponse {
  int64 total_lines = 1;
  int64 index_lag = 2;
  int64 segment_count = 3;
  int64 disk_bytes = 4;
}
