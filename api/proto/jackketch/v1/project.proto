// ProjectService manages project identity and workspace resolution.
syntax = "proto3";

package jackketch.v1;
option go_package = "jack-ketch/gen/jackketch/v1;jackketchv1";

import "jackketch/v1/common.proto";

service ProjectService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc LinkWorkspace(LinkWorkspaceRequest) returns (LinkWorkspaceResponse);
  rpc ForgetProject(ForgetProjectRequest) returns (ForgetProjectResponse);
  rpc GC(GCRequest) returns (GCResponse);
  rpc ListNestedProjects(ListNestedProjectsRequest) returns (ListNestedProjectsResponse);
  rpc MergeNestedProject(MergeNestedProjectRequest) returns (MergeNestedProjectResponse);
}

message ResolveRequest {
  string path = 1;
}
message ResolveResponse {
  string project_id = 1;
  string workspace_id = 2;
  string project_name = 3;
  bool newly_created = 4;
  repeated string unresolved_locators = 5;
  string attached_subpath = 6;
}

message ListProjectsRequest {
  Pagination pagination = 1;
}
message ListProjectsResponse {
  repeated Project projects = 1;
  Cursor next_page_token = 2;
}

message Project {
  string id = 1;
  string name = 2;
  string config_mode = 3;
  int64 last_used_at = 4;
  int32 workspace_count = 5;
}

message GetProjectRequest { string project_id = 1; }
message GetProjectResponse { Project project = 1; }

message UpdateProjectRequest {
  string project_id = 1;
  string name = 2;
}
message UpdateProjectResponse { Project project = 1; }

message ListWorkspacesRequest {
  string project_id = 1;
  Pagination pagination = 2;
}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  Cursor next_page_token = 2;
}

message Workspace {
  string id = 1;
  string project_id = 2;
  string path = 3;
  bool confirmed = 4;
  int64 last_seen_at = 5;
}

message LinkWorkspaceRequest {
  string project_id = 1;
  string path = 2;
}
message LinkWorkspaceResponse { Workspace workspace = 1; }

message ForgetProjectRequest { string project_id = 1; }
message ForgetProjectResponse {}

message GCRequest {}
message GCResponse {
  repeated string removed_workspaces = 1;
}


message NestedSide {
  string project_id = 1;
  string project_name = 2;
  string workspace_id = 3;
  string path = 4;
}

message NestedApp {
  string name = 1;
  string workdir = 2;
  string status = 3; // duplicate | conflict | unique | added
  string parent_app = 4;
  string detail = 5;
}

message NestedProject {
  NestedSide child = 1;
  NestedSide parent = 2;
  repeated NestedApp apps = 3;
  int32 running = 4;
}

message ListNestedProjectsRequest {}
message ListNestedProjectsResponse {
  repeated NestedProject nested = 1;
}

message MergeNestedProjectRequest {
  string child_project_id = 1;
  string parent_project_id = 2;
  bool dry_run = 3;
}
message MergeNestedProjectResponse {
  NestedSide child = 1;
  NestedSide parent = 2;
  repeated NestedApp apps = 3;
  map<string, string> renamed = 4;
  int32 credentials = 5;
  int32 running = 6;
  bool applied = 7;
  int64 revision = 8;
  int32 credentials_moved = 9;
  int32 credentials_skipped = 10;
  string yaml = 11;
}
