{{ $docs := site.GetPage "/docs" }}
<aside class="sidebar" id="sidebar" aria-label="Documentation">
  <div class="sb-scroll">
    <button class="btn-search wide" type="button" data-search-open>
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search docs</span><kbd>/</kbd>
    </button>
    <a class="sb-link top {{ if eq . $docs }}on{{ end }}" href="{{ $docs.RelPermalink }}">Overview</a>
    {{ partial "sidebar-tree.html" (dict "pages" $docs.Pages "cur" .) }}
  </div>
</aside>
