<header class="site-top">
  <div class="site-top-in">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="jack-ketch home">{{ partial "logo.html" . }}<span>jack-ketch</span></a>
    <nav class="nav" aria-label="Primary">
      {{ $cur := . }}
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" class="{{ if or ($cur.HasMenuCurrent "main" .) ($cur.IsMenuCurrent "main" .) }}on{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="top-actions">
      <button class="btn-search" type="button" data-search-open aria-label="Search docs">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Search</span><kbd>/</kbd>
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="icon-btn" href="{{ site.Params.repo }}" aria-label="GitHub repository" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="fill"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
      </a>
      <button class="icon-btn menu-btn" type="button" data-menu-toggle aria-label="Open navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
