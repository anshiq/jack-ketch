<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-theme="dark">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
<a class="skip" href="#content">Skip to content</a>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
{{ partial "search.html" . }}
{{ $js := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
