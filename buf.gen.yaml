version: v2
# One schema produces the Go SDK, the TypeScript client and the docs.
# Generated code is committed; CI checks `make proto` is clean and runs
# `buf breaking` against master.
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
